# monitor-cambio/docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORTA_HOST:-5434}:5432"   # portas do host configuráveis: 5432/5433/8000 já usadas por outros projetos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "${API_PORTA_HOST:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy   # só sobe quando o banco aceita conexões

volumes:
  pgdata:
