# monitor-cambio/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      # Testes contra PostgreSQL real (localmente rodam em SQLite)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cambio
          POSTGRES_PASSWORD: cambio-ci
          POSTGRES_DB: cambio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cambio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cambio:cambio-ci@localhost:5432/cambio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t monitor-cambio .
